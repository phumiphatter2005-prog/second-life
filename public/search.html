<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#7E2A8C">
  <title>ค้นหาสินค้า | Second Life</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600&family=IBM+Plex+Sans+Thai:wght@400;600&family=JetBrains+Mono&display=swap">
  <link rel="stylesheet" href="css/style.css?v=21">
</head>
<body>

  <header class="navbar">
    <div class="container">
      <a href="index.html" class="logo">Second Life</a>
      <nav class="nav-links">
        <a href="index.html">หน้าแรก</a>
        <a href="search.html" class="active">หมวดหมู่</a>
        <a href="post.html">ลงประกาศ</a>
        <a href="favorites.html">รายการโปรด</a>
      </nav>
    </div>
  </header>

  <main class="container search-layout">
    <!-- คอม: แผงซ้ายติดจอ · มือถือ: แผ่นเลื่อนขึ้นจากล่าง (เปิดด้วยปุ่ม "ตัวกรอง") -->
    <div class="filters-backdrop" id="filters-backdrop" hidden></div>
    <aside class="filters" id="filters" aria-labelledby="filters-title" tabindex="-1">
      <div class="filters-head">
        <h2 id="filters-title">ตัวกรอง</h2>
        <button id="f-reset" type="button" class="filters-reset" hidden>ล้าง (<span id="f-reset-n">0</span>)</button>
        <button id="f-close" type="button" class="filters-close" aria-label="ปิดตัวกรอง"></button>
      </div>

      <div class="filters-body">
        <fieldset class="f-group">
          <legend>ประเภทประกาศ</legend>
          <div id="f-type" class="type-seg">
            <button type="button" data-value="all" aria-pressed="true"><i class="dot dot-all"></i>ทั้งหมด</button>
            <button type="button" data-value="sell" aria-pressed="false"><i class="dot dot-sell"></i>ขาย</button>
            <button type="button" data-value="swap" aria-pressed="false"><i class="dot dot-swap"></i>แลก</button>
            <button type="button" data-value="free" aria-pressed="false"><i class="dot dot-free"></i>แจกฟรี</button>
          </div>
        </fieldset>

        <fieldset class="f-group">
          <legend>สภาพสินค้า</legend>
          <div id="f-cond" class="f-checks"></div>
        </fieldset>

        <fieldset class="f-group">
          <legend>ช่วงราคา (บาท)</legend>
          <div class="f-price">
            <input id="f-min" type="number" min="0" step="1" inputmode="numeric" placeholder="ต่ำสุด" aria-label="ราคาต่ำสุด">
            <span aria-hidden="true">–</span>
            <input id="f-max" type="number" min="0" step="1" inputmode="numeric" placeholder="สูงสุด" aria-label="ราคาสูงสุด">
          </div>
        </fieldset>
      </div>

      <div class="filters-foot">
        <button id="f-apply" type="button" class="btn btn-primary">ดูผล <span id="f-apply-n">0</span> รายการ</button>
      </div>
    </aside>

    <section class="results">
      <div class="search-bar">
        <label class="search-field">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="f-q" type="search" placeholder="ค้นหาสินค้า..." aria-label="ค้นหาสินค้า">
        </label>
        <button id="f-open" type="button" class="btn btn-secondary filters-open" aria-expanded="false" aria-controls="filters">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 5h18M6 12h12M10 19h4"/></svg>
          ตัวกรอง<span id="f-open-n" class="filters-count" hidden></span>
        </button>
      </div>
      <div id="cat-pills" class="cat-pills-wrap" role="group" aria-label="หมวดหมู่"></div>
      <div class="results-head">
        <p id="result-count" class="result-count" aria-live="polite"></p>
        <select id="f-sort" class="sort-select" aria-label="เรียงลำดับ">
          <option value="latest">ล่าสุด</option>
          <option value="price-asc">ราคาต่ำ-สูง</option>
          <option value="price-desc">ราคาสูง-ต่ำ</option>
        </select>
      </div>
      <div id="active-filters" class="active-filters" hidden></div>
      <div id="results" class="grid"></div>
    </section>
  </main>

  <script src="js/config.js?v=21"></script>
  <script src="js/supabase.js?v=21"></script>
  <script src="js/demo.js?v=21"></script>
  <script src="js/data.js?v=21"></script>
  <script src="js/app.js?v=21"></script>
  <script src="js/search.js?v=21"></script>
</body>
</html>
