<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#7E2A8C">
  <title>ค้นหาสินค้า | Second Life</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600&family=IBM+Plex+Sans+Thai:wght@400;600&family=JetBrains+Mono&display=swap">
  <link rel="stylesheet" href="css/style.css?v=11">
</head>
<body>

  <header class="navbar">
    <div class="container">
      <a href="index.html" class="logo">Second Life</a>
      <nav class="nav-links">
        <a href="index.html">หน้าแรก</a>
        <a href="search.html" class="active">หมวดหมู่</a>
        <a href="post.html">ลงประกาศ</a>
        <a href="favorites.html">รายการโปรด</a>
      </nav>
    </div>
  </header>

  <main class="container search-layout">
    <aside class="filters" id="filters">
      <div class="filters-top">
        <input id="f-q" type="search" placeholder="ค้นหาสินค้า..." aria-label="ค้นหาสินค้า">
        <button id="f-toggle" type="button" class="btn btn-secondary filters-toggle" aria-expanded="false" aria-controls="filters-body">ตัวกรอง</button>
      </div>

      <div class="filters-body" id="filters-body">
      <label>ประเภทประกาศ</label>
      <div id="f-type" class="chips">
        <button class="chip active" data-value="all">ทั้งหมด</button>
        <button class="chip" data-value="sell">ขาย</button>
        <button class="chip" data-value="swap">แลกเปลี่ยน</button>
        <button class="chip" data-value="free">แจกฟรี</button>
      </div>

      <label>หมวดหมู่</label>
      <select id="f-cat"></select>

      <label>สภาพสินค้า</label>
      <select id="f-cond">
        <option value="all">ทั้งหมด</option>
        <option value="ดีมาก">ดีมาก</option>
        <option value="ดี">ดี</option>
        <option value="พอใช้">พอใช้</option>
      </select>

      <button id="f-reset" class="btn-outline">ล้างตัวกรอง</button>
      </div>
    </aside>

    <section class="results">
      <div id="cat-tabs" class="cat-tabs" role="tablist" aria-label="หมวดหมู่"></div>
      <p id="result-count" class="result-count"></p>
      <div id="results" class="grid"></div>
    </section>
  </main>

  <script src="js/config.js?v=11"></script>
  <script src="js/supabase.js?v=11"></script>
  <script src="js/demo.js?v=11"></script>
  <script src="js/data.js?v=11"></script>
  <script src="js/app.js?v=11"></script>
  <script src="js/search.js?v=11"></script>
</body>
</html>
