<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#7E2A8C">
  <title>เข้าสู่ระบบ | Second Life</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600&family=IBM+Plex+Sans+Thai:wght@400;600&family=JetBrains+Mono&display=swap">
  <link rel="stylesheet" href="css/style.css?v=10">
</head>
<body>

  <header class="navbar">
    <div class="container">
      <a href="index.html" class="logo">Second Life</a>
      <nav class="nav-links">
        <a href="index.html">หน้าแรก</a>
        <a href="search.html">หมวดหมู่</a>
        <a href="post.html">ลงประกาศ</a>
        <a href="favorites.html">รายการโปรด</a>
      </nav>
    </div>
  </header>

  <main class="auth-split">
    <!-- ซ้าย (มือถือ: แถบบน): แผงม่วง รูปสินค้าจริงลอยขยับช้าๆ -->
    <aside class="auth-art">
      <div class="auth-floats" aria-hidden="true">
        <img class="f1" src="images/sample-headphones.jpg" alt="">
        <img class="f2" src="images/sample-hoodie.jpg" alt="">
        <img class="f3" src="images/sample-cs-book.jpg" alt="">
        <img class="f4" src="images/sample-lamp.jpg" alt="">
        <img class="f5" src="images/sample-backpack.jpg" alt="">
      </div>
      <div class="auth-copy">
        <span class="overline">Second Life</span>
        <h1>ให้ของได้มี<br>ชีวิตที่สอง</h1>
        <p>ซื้อ ขาย แลกเปลี่ยน และแจกฟรี ภายในชุมชนมหาวิทยาลัย</p>
      </div>
    </aside>

    <!-- ขวา (มือถือ: ด้านล่าง): ฟอร์ม -->
    <section class="auth-panel">
      <div class="auth-box">
        <h2 id="auth-heading">ยินดีต้อนรับกลับมา</h2>
        <p class="muted" id="auth-sub">เข้าสู่ระบบด้วยรหัสนักศึกษา</p>

        <div id="auth-tabs" class="seg" role="tablist" data-mode="login">
          <span class="seg-pill" aria-hidden="true"></span>
          <button type="button" role="tab" class="active" aria-selected="true" data-mode="login">เข้าสู่ระบบ</button>
          <button type="button" role="tab" aria-selected="false" data-mode="register">สมัครสมาชิก</button>
        </div>

        <form id="auth-form" class="auth-form" novalidate>
          <div class="float-field">
            <input id="a-sid" type="text" inputmode="numeric" maxlength="8" autocomplete="username"
              placeholder=" " aria-describedby="sid-msg">
            <label for="a-sid">รหัสนักศึกษา 8 หลัก</label>
            <p class="field-msg" id="sid-msg" aria-live="polite"></p>
          </div>

          <div class="float-field" id="name-field" hidden>
            <input id="a-name" type="text" autocomplete="nickname" maxlength="60" placeholder=" ">
            <label for="a-name">ชื่อที่จะแสดง</label>
          </div>

          <div class="float-field has-eye">
            <input id="a-pass" type="password" autocomplete="current-password" placeholder=" ">
            <label for="a-pass">รหัสผ่าน</label>
            <button type="button" class="eye-btn" id="a-eye" aria-label="แสดงรหัสผ่าน" title="แสดงรหัสผ่าน"></button>
          </div>

          <div class="strength" id="strength" data-level="0" hidden>
            <div class="strength-bar"><span></span></div>
            <span class="strength-label" aria-live="polite"></span>
          </div>

          <p class="form-error" role="alert" hidden></p>
          <button type="submit" id="a-submit" class="btn-primary auth-submit" disabled>
            <span class="btn-label">เข้าสู่ระบบ</span>
            <span class="spinner" aria-hidden="true"></span>
            <svg class="done-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>
          </button>
        </form>
      </div>
    </section>
  </main>

  <script src="js/config.js?v=10"></script>
  <script src="js/supabase.js?v=10"></script>
  <script src="js/demo.js?v=10"></script>
  <script src="js/data.js?v=10"></script>
  <script src="js/app.js?v=10"></script>
  <script src="js/login.js?v=10"></script>
</body>
</html>
